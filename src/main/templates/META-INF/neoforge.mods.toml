modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Cells that contain a 16x16x16 room one scale level down, nested up to three levels deep.
Build 3D fabrication patterns inside them with automation from any mod, look into rooms with
microscopes, work in them remotely with manipulators, connect them through ports, or shrink
down and enter them in person.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[29.53,)"
    ordering="AFTER"
    side="CLIENT"
